    <noscript><main style="max-width:48rem;margin:0 auto;padding:2rem 1rem;font-family:Arial,system-ui,sans-serif;line-height:1.6;color:#0F0F0E"><p><a href="/">Home</a> / Ahmad Al-Jaber Oil &amp; Gas Exhibition - KOC</p><h1>Ahmad Al-Jaber Oil &amp; Gas Exhibition - KOC</h1><p>A responsive redesign for Kuwait Oil Company&#39;s national exhibition, turning dense museum content into a clear visitor journey.</p><p><strong>Discipline:</strong> Web Design, UX, Responsive | <strong>Year:</strong> 2018 | <strong>Client:</strong> Kuwait Oil Company (KOC) | <strong>Role:</strong> Lead Designer</p><section><h2>Context</h2><p>The Ahmad Al-Jaber Oil &amp; Gas Exhibition website introduces a national exhibition to schools, delegations, and general visitors.</p></section><section><h2>Problem</h2><p>Dense institutional content needed to become a clear visitor journey that explained the exhibition while making practical information easy to find.</p></section><section><h2>Role and scope</h2><p>Lead Designer responsible for information architecture, visual direction, responsive layouts, gallery presentation, and front-end design handoff.</p></section><section><h2>Constraints</h2><ul><li>Serve visitors with different levels of subject knowledge and different reasons for visiting.</li><li>Balance institutional storytelling with practical visit information.</li><li>Keep image-rich content usable across mobile and desktop connections.</li></ul></section><section><h2>Key decisions</h2><ol><li>Organized the experience around visitor questions rather than the source content structure.</li><li>Used the gallery as supporting evidence while keeping visit information in the primary reading flow.</li><li>Established responsive patterns that preserved hierarchy without relying on hover.</li></ol></section><section><h2>What shipped</h2><ul><li>A redesigned exhibition homepage and content hierarchy.</li><li>Responsive visitor-information pages.</li><li>Image-led gallery and exhibition storytelling.</li><li>Front-end patterns for the public website.</li></ul></section><section><h2>Outcome</h2><p>The redesign gave the exhibition a clearer public-facing journey and a more coherent way to present its spaces, story, and visitor information.</p></section><section><h2>Reflection</h2><p>The work showed how quickly an institutional site improves when navigation is organized around visitor intent instead of internal departments.</p></section><p><a href="https://www.kocexhibit.com/" rel="noopener noreferrer">View live project</a></p><p><a href="/">Back to all projects</a></p></main></noscript>
